<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#b3122e">
<title>模擬店どこ？ | 紅華祭2026</title>
<style>
  :root {
    --bg: #faf7f5;
    --surface: #ffffff;
    --text: #1d1a19;
    --muted: #6d6461;
    --line: #e7dfdb;
    --accent: #b3122e;
    --accent-soft: #fbe8eb;
    --tag: #f1ebe8;
    --warn: #9a3412;
    --warn-soft: #fdebd8;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161312;
      --surface: #211d1c;
      --text: #f3eeec;
      --muted: #a89f9b;
      --line: #36302e;
      --accent: #ff6b81;
      --accent-soft: #3a1c22;
      --tag: #2e2827;
      --warn: #fdba74;
      --warn-soft: #3b2414;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 48px; }

  header { padding: 20px 0 6px; }
  header h1 { margin: 0; font-size: 1.35rem; letter-spacing: .02em; }
  header h1 span { color: var(--accent); }
  header p { margin: 4px 0 0; color: var(--muted); font-size: .85rem; }

  .search {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding: 10px 0;
  }
  .box {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: var(--radius);
    padding: 0 12px;
    transition: border-color .15s;
  }
  .box:focus-within { border-color: var(--accent); }
  .box svg { flex: none; color: var(--muted); }
  .box input {
    flex: 1; min-width: 0;
    border: 0; outline: 0; background: transparent; color: var(--text);
    font-size: 1.1rem; padding: 14px 0;
  }
  .box input::placeholder { color: var(--muted); }
  .box input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
  .clear {
    border: 0; background: var(--line); color: var(--text);
    width: 26px; height: 26px; border-radius: 50%;
    font-size: 15px; line-height: 26px; cursor: pointer; display: none;
  }
  .clear.show { display: block; }

  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--text);
    border-radius: 999px; padding: 5px 11px 5px 6px; font-size: .85rem; cursor: pointer;
    font-family: inherit;
  }
  .chip.all { padding-left: 11px; }
  .chip small { color: var(--muted); }
  .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .sw {
    width: 22px; height: 22px; border-radius: 6px;
    display: inline-grid; place-items: center;
    font-weight: 800; font-size: .8rem; line-height: 1;
  }

  .status { color: var(--muted); font-size: .85rem; margin: 6px 2px 10px; }

  .group-h {
    display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px;
    margin: 22px 2px 8px; font-size: 1rem;
  }
  .group-h .near { font-weight: 400; font-size: .9rem; }
  .group-h a { margin-left: auto; font-size: .8rem; font-weight: 400; }

  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .card {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px;
  }
  .badge {
    flex: none;
    width: 56px; height: 56px; border-radius: 12px;
    display: grid; place-items: center; text-align: center;
    font-weight: 800; line-height: 1;
  }
  .badge .l { font-size: 1.6rem; }
  .badge .s { font-size: .72rem; font-weight: 700; margin-top: 3px; letter-spacing: .04em; }
  .info { flex: 1; min-width: 0; }
  .where { font-size: .95rem; }
  .where b { margin-right: 4px; }
  .zone { font-size: .8rem; color: var(--accent); font-weight: 600; }
  .name { font-size: 1rem; margin-top: 2px; overflow-wrap: anywhere; }
  .org { font-size: .82rem; color: var(--muted); overflow-wrap: anywhere; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .tag { font-size: .7rem; padding: 1px 7px; border-radius: 6px; background: var(--tag); color: var(--muted); }
  .tag.warn { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
  .maplink {
    font-size: .7rem; text-decoration: none; white-space: nowrap;
    color: var(--accent); border: 1px solid currentColor;
    border-radius: 6px; padding: 0 7px;
  }
  a { color: var(--accent); }

  /* エリア一覧では見出しにエリアと地図が出ているので各カードでは省略 */
  .grouped .where, .grouped .maplink, .grouped .tags.only-map { display: none; }

  /* 1件だけヒットしたら答えを大きく */
  .solo .card { padding: 18px 16px; }
  .solo .badge { width: 76px; height: 76px; }
  .solo .badge .l { font-size: 2.3rem; }
  .solo .badge .s { font-size: .85rem; }
  .solo .where { font-size: 1.12rem; }
  .solo .zone { font-size: .9rem; }

  .empty {
    text-align: center; color: var(--muted);
    padding: 36px 12px; border: 1.5px dashed var(--line); border-radius: var(--radius);
  }

  footer { margin-top: 36px; color: var(--muted); font-size: .78rem; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>模擬店<span>どこ？</span></h1>
    <p>第22回 紅華祭 / 店名・団体名・メニュー・出店番号（例：D07）で検索</p>
  </header>

  <div class="search">
    <label class="box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off"
             placeholder="例：焼きそば / 弓道部 / チュロス" aria-label="模擬店を検索">
      <button class="clear" id="clear" type="button" aria-label="クリア">×</button>
    </label>
    <div class="chips" id="chips" role="group" aria-label="エリアで絞り込み"></div>
  </div>

  <div class="status" id="status" aria-live="polite"></div>
  <div id="results"></div>

  <footer>
    模擬店営業：10/11（日）11:00–17:00 ／ 10/12（月・祝）10:00–16:00<br>
    キッチンカー（Aエリア）とコンソーシアム（F・Gエリア）ではお楽しみ券は使えません<br>
    出典：<a href="https://koukasai.jp/2026/shop/" target="_blank" rel="noopener">公式サイト 模擬店ページ</a>、パンフレット「エリア案内」・各エリア配置図 ／
    <a href="https://koukasai.jp/2026/map" target="_blank" rel="noopener">会場MAP</a><br>
    実行委員会 内部向け
  </footer>
</div>

<script src="shops.js"></script>
<script>
(() => {
  const AREAS = window.AREAS, TYPES = window.TYPES, SHOPS = window.SHOPS;
  const VENUE_MAP = "https://koukasai.jp/2026/map";
  const $q = document.getElementById("q");
  const $clear = document.getElementById("clear");
  const $chips = document.getElementById("chips");
  const $status = document.getElementById("status");
  const $results = document.getElementById("results");

  // 表記ゆれ吸収：全角半角・大小文字・カタカナ/ひらがな・記号と空白を無視
  const norm = (s) => s.normalize("NFKC").toLowerCase()
    .replace(/[ァ-ヶ]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60))
    .replace(/[\s・·『』「」（）()！!？?♡☆★、。,.\-ー－〜~_#&＆]/g, "");

  const zoneOf = (s) => {
    const n = parseInt(s.no, 10);
    const z = AREAS[s.area].zones.find((z) => n <= z.to);
    return z ? z.label : "";
  };

  const index = SHOPS.map((s, i) => {
    const a = AREAS[s.area], t = TYPES[s.type || "shop"];
    const zone = zoneOf(s);
    return {
      ...s, i, zone, typeLabel: t.label, noTicket: !!t.noTicket,
      nName: norm(s.name), nOrg: norm(s.org || ""),
      hay: norm([s.name, s.org || "", s.kw || "", a.name, a.near, zone, t.label].join(" ")),
    };
  });

  let area = "";

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const swatch = (k) => `<span class="sw" style="background:${AREAS[k].bg};color:${AREAS[k].fg}">${k}</span>`;

  function renderChips() {
    const counts = {};
    SHOPS.forEach((s) => (counts[s.area] = (counts[s.area] || 0) + 1));
    $chips.innerHTML =
      `<button class="chip all" type="button" data-area="" aria-pressed="${area === ""}">すべて<small>${SHOPS.length}</small></button>` +
      Object.keys(AREAS).map((k) =>
        `<button class="chip" type="button" data-area="${k}" aria-pressed="${k === area}" aria-label="${esc(AREAS[k].name)}">${swatch(k)}<small>${counts[k] || 0}</small></button>`
      ).join("");
  }

  function search(raw) {
    const terms = raw.trim().split(/[\s　]+/).filter(Boolean);
    let list = index.filter((s) => !area || s.area === area);
    if (!terms.length) return { list, scored: false };
    list = list.map((s) => {
      let score = 0;
      for (const t of terms) {
        const t0 = t.normalize("NFKC").toLowerCase();
        // 出店番号（d07 / D-7 など）は完全一致
        const booth = t0.match(/^([a-z])-?(\d{1,2})$/);
        if (booth && AREAS[booth[1].toUpperCase()]) {
          if (s.area !== booth[1].toUpperCase() || parseInt(s.no, 10) !== parseInt(booth[2], 10)) return null;
          score += 10; continue;
        }
        // アルファベット1文字はエリア指定
        if (/^[a-z]$/.test(t0) && AREAS[t0.toUpperCase()]) {
          if (s.area !== t0.toUpperCase()) return null;
          score += 1; continue;
        }
        const n = norm(t);
        if (!n) continue;
        if (!s.hay.includes(n)) return null;
        score += s.nName.startsWith(n) ? 6 : s.nOrg.startsWith(n) ? 5 : s.nName.includes(n) ? 4 : s.nOrg.includes(n) ? 3 : 1;
      }
      return { ...s, score };
    }).filter(Boolean).sort((a, b) => b.score - a.score || a.i - b.i);
    return { list, scored: true };
  }

  function card(s) {
    const a = AREAS[s.area];
    const tags = [];
    if (s.type) tags.push(`<span class="tag">${esc(s.typeLabel)}</span>`);
    if (s.noTicket) tags.push(`<span class="tag warn">お楽しみ券不可</span>`);
    if (s.days) tags.push(`<span class="tag warn">${esc(s.days)}</span>`);
    const map = `<a class="maplink" href="${a.map || VENUE_MAP}" target="_blank" rel="noopener">${a.map ? "地図" : "会場MAP"} ↗</a>`;
    return `<li class="card">
      <div class="badge" style="background:${a.bg};color:${a.fg}"><div><div class="l">${s.area}</div><div class="s">${esc(s.no)}</div></div></div>
      <div class="info">
        <div class="where"><b>${esc(a.name)}</b>${esc(a.near)}</div>
        ${s.zone ? `<div class="zone">${esc(s.zone)}</div>` : ""}
        <div class="name">${esc(s.name)}</div>
        ${s.org ? `<div class="org">${esc(s.org)}</div>` : ""}
        <div class="tags${tags.length ? "" : " only-map"}">${tags.join("")}${map}</div>
      </div>
    </li>`;
  }

  function render() {
    const raw = $q.value;
    $clear.classList.toggle("show", raw.length > 0);
    const { list, scored } = search(raw);

    if (!list.length) {
      $status.textContent = "";
      $results.innerHTML = `<div class="empty">「${esc(raw.trim())}」は見つかりませんでした<br><small>メニュー名（例：たこ焼き）や団体名の一部、出店番号（例：E12）でも探せます</small></div>`;
      return;
    }

    if (scored) {
      $status.textContent = `${list.length}件`;
      $results.innerHTML = `<ul class="${list.length === 1 ? "solo" : ""}">${list.map(card).join("")}</ul>`;
      return;
    }

    // 未入力：エリアごとに一覧
    $status.textContent = `${list.length}店舗`;
    const groups = {};
    list.forEach((s) => (groups[s.area] = groups[s.area] || []).push(s));
    $results.innerHTML = `<div class="grouped">` + Object.keys(AREAS).filter((k) => groups[k]).map((k) => {
      const a = AREAS[k];
      return `<h2 class="group-h">${swatch(k)}${esc(a.name)}<span class="near">${esc(a.near)}</span><a href="${a.map || VENUE_MAP}" target="_blank" rel="noopener">${a.map ? "地図で見る" : "会場MAP"}</a></h2>
        <ul>${groups[k].map(card).join("")}</ul>`;
    }).join("") + `</div>`;
  }

  function syncUrl() {
    const p = new URLSearchParams();
    if ($q.value.trim()) p.set("q", $q.value.trim());
    if (area) p.set("area", area);
    const qs = p.toString();
    history.replaceState(null, "", qs ? `?${qs}` : location.pathname);
  }

  // 初期状態（?q=...&area=... に対応）
  const params = new URLSearchParams(location.search);
  $q.value = params.get("q") || "";
  const pa = (params.get("area") || "").toUpperCase();
  area = AREAS[pa] ? pa : "";

  renderChips();
  render();

  $q.addEventListener("input", () => { render(); syncUrl(); });
  $clear.addEventListener("click", () => { $q.value = ""; render(); syncUrl(); $q.focus(); });
  $chips.addEventListener("click", (e) => {
    const b = e.target.closest(".chip");
    if (!b) return;
    area = b.dataset.area === area ? "" : b.dataset.area;
    renderChips(); render(); syncUrl();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement !== $q) { e.preventDefault(); $q.focus(); }
  });
})();
</script>
</body>
</html>
